name: Rewrite micro-topic knowledge

on:
  push:
    branches: [main]
    paths:
      - scripts/rewrite_microtopic_notes.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite learner-first micro-topic knowledge
        run: python scripts/rewrite_microtopic_notes.py
      - name: Commit rewritten knowledge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.js content-version.js
          git diff --cached --quiet && exit 0
          git commit -m "Rewrite micro-topic knowledge for active learning"
          git push
