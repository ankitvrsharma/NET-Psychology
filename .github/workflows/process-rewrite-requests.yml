name: Process Content Rewrite Requests

on:
  workflow_dispatch:
  push:
    paths:
      - rewrite-requests.json
      - scripts/process_rewrite_requests.py

permissions:
  contents: write

concurrency:
  group: content-rewrite-requests
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite requested content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_REWRITE_MODEL: ${{ vars.GEMINI_REWRITE_MODEL }}
        run: python scripts/process_rewrite_requests.py
      - name: Validate generated content
        run: python scripts/validate_content_pools.py
      - name: Commit rewritten content
        run: |
          git config user.name "net-psychology-rewrite[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/microtopics/microtopic_explanations.json rewrite-requests.json rewrite-reaudit-tracking.json
          git diff --cached --quiet && exit 0
          git commit -m "Apply requested content rewrite"
          git push
