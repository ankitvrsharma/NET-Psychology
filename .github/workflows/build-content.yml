name: Build Psychology content bundle

on:
  push:
    branches: [main]
    paths:
      - data.json
      - scripts/build_practice.py
      - .github/workflows/build-content.yml

permissions:
  contents: write

jobs:
  build-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Validate content JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data.json").read_text(encoding="utf-8"))
          assert isinstance(data,dict) and isinstance(data.get("units"),list)
          print(f"Validated {len(data['units'])} units")
          PY

      - name: Build verified PYQ question bank
        run: python scripts/build_practice.py

      - name: Build browser content bundle
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          raw=Path("data.json").read_text(encoding="utf-8")
          version=hashlib.sha256(raw.encode("utf-8")).hexdigest()[:16]
          Path("data.js").write_text("window.NETPSY_DATA = "+raw+";\n",encoding="utf-8")
          Path("content-version.js").write_text("window.NETPSY_DATA_VERSION = "+json.dumps(version)+";\n",encoding="utf-8")
          print("Built data.js and content-version.js:",version)
          PY

      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js content-version.js practice_questions.json practice-build-report.json
          if git diff --cached --quiet; then
            echo "Generated bundles are already current."
            exit 0
          fi
          git commit -m "chore: rebuild Psychology content and PYQ practice bank"
          git push
