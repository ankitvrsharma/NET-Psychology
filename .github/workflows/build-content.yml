name: Validate published Psychology content

on:
  push:
    branches: [main]
    paths:
      - data/syllabus-index.json
      - content/**
      - content-pools/pool-integrity.js
      - scripts/validate_content.py
      - scripts/content_health_report.py
      - sources/source-register.json
      - schemas/source-register.schema.json
      - scripts/supabase_sync.py
      - scripts/source_to_content.py
      - scripts/sync_documentation.py
      - docs/architecture/content-architecture.md
      - content-pools/registry.json
      - .github/workflows/build-content.yml
  pull_request:
    branches: [main]
    paths:
      - data/syllabus-index.json
      - content/**
      - content-pools/pool-integrity.js
      - scripts/validate_content.py
      - scripts/source_to_content.py
      - scripts/sync_documentation.py
      - docs/architecture/content-architecture.md
      - content-pools/registry.json
      - .github/workflows/build-content.yml

permissions:
  contents: read

jobs:
  validate-published-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checked-out source integrity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show HEAD:scripts/source_to_content.py > /tmp/source_to_content.py
          cmp -s scripts/source_to_content.py /tmp/source_to_content.py || {
            echo "::error::Checked-out source_to_content.py differs from the committed Git blob."
            sha256sum scripts/source_to_content.py /tmp/source_to_content.py
            exit 1
          }
          echo "HEAD: $GITHUB_SHA"
          echo "source_to_content.py SHA256: $(sha256sum scripts/source_to_content.py | cut -d' ' -f1)"
      - name: Validate canonical static pools
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          syllabus=json.loads(Path('data/syllabus-index.json').read_text(encoding='utf-8'))
          assert isinstance(syllabus.get('units'),list) and syllabus['units'], 'Syllabus is empty'
          canonical={}
          for unit in syllabus['units']:
              for topic in unit.get('topics',[]):
                  for micro in topic.get('microtopics',[]):
                      key=f"{unit['id']}-{topic['id']}-{micro['id']}"
                      canonical[key]=micro.get('title','')

          one_to_one={
              'microtopics':'content/microtopics/micro_topics.json',
              'deepDive':'content/deep-dive/deep_dive.json',
              'activeRecall':'content/active-recall/active_recall.json',
              'revisionGuidance':'content/revision/revision_guidance.json',
          }
          for name,path in one_to_one.items():
              pool=json.loads(Path(path).read_text(encoding='utf-8'))
              missing=[k for k in canonical if k not in pool]
              extra=[k for k in pool if k not in canonical]
              mismatched=[k for k in canonical if k in pool and str(pool[k].get('title',''))!=str(canonical[k])]
              assert not missing and not extra and not mismatched, f"{name}: missing={len(missing)} extra={len(extra)} title_mismatches={len(mismatched)}"
              print(f"{name}: {len(pool)} entries; OK")

          quick=json.loads(Path('content/quick-learn/quick_cards.json').read_text(encoding='utf-8'))
          quick_micro_ids={str(v.get('unit'))+'-'+str(v.get('topic'))+'-'+str(v.get('micro')) for v in quick.values()}
          stale_quick=[k for k in quick_micro_ids if k not in canonical]
          print(f"quickLearn: {len(quick)} cards covering {len(quick_micro_ids)} micro-topics; stale/non-canonical references: {len(stale_quick)}")

          questions=json.loads(Path('content/questions/questions.json').read_text(encoding='utf-8'))
          questions = questions if isinstance(questions,list) else [*questions.get('pyq',[]),*questions.get('practice',[])]
          assert questions, 'Question pool is empty'
          assert all(isinstance(q.get('options'),list) and len(q['options'])==4 for q in questions), 'Question with invalid options'
          assert all(isinstance(q.get('answer'),int) and 0<=q['answer']<=3 for q in questions), 'Question with invalid answer'
          invalid=[q.get('id') for q in questions if any(v is not None for v in (q.get('unit'),q.get('topic'),q.get('micro'))) and f"{q.get('unit')}-{q.get('topic')}-{q.get('micro')}" not in canonical]
          unmapped=sum(any(q.get(k) is None for k in ('unit','topic','micro')) for q in questions)
          print(f"questions: {len(questions)} entries; unresolved mappings: {unmapped}; non-canonical mappings: {len(invalid)}")

          practice=json.loads(Path('content/practice/practice_mcqs.json').read_text(encoding='utf-8'))
          assert isinstance(practice,dict), 'Practice package pool must be a JSON object'
          practice_extra=[k for k in practice if k not in canonical]
          assert not practice_extra, f'practice: non-canonical micro-topic IDs: {practice_extra[:10]}'
          malformed=[]
          for mid,item in practice.items():
              questions_for_topic=item.get('questions',[]) if isinstance(item,dict) else []
              if not isinstance(questions_for_topic,list) or any(
                  not isinstance(q,dict) or not str(q.get('question','')).strip() or
                  not isinstance(q.get('options'),list) or len(q.get('options',[]))<2 or
                  not str(q.get('correct_answer','')).strip() or not str(q.get('explanation','')).strip()
                  for q in questions_for_topic
              ):
                  malformed.append(mid)
          assert not malformed, f'practice: malformed packages: {malformed[:10]}'
          print(f"practice: {len(practice)} package entries; OK")

          print(f"canonical micro-topics: {len(canonical)}")
          PY
      - name: Check architecture documentation
        run: python scripts/sync_documentation.py
      - name: Compile content automation script
        run: |
          python -m py_compile scripts/source_to_content.py scripts/sync_documentation.py
          python -m py_compile scripts/supabase_sync.py
      - name: Run static content validator
        run: python scripts/validate_content.py
      - name: Generate content-health triage and validate source register
        run: python scripts/content_health_report.py

      - name: Sync canonical static pools to Supabase
        if: ${{ github.event_name == 'push' && success() }}
        env:
          SUPABASE_URL: https://ncndgskqkczfurfiycng.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/supabase_sync.py
