name: Validate Psychology content

on:
  push:
    branches: [main]
    paths:
      - syllabus-index.json
      - content/**
      - scripts/validate_content.py
      - .github/workflows/build-content.yml
  pull_request:
    branches: [main]
    paths:
      - syllabus-index.json
      - content/**
      - scripts/validate_content.py
      - .github/workflows/build-content.yml

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate canonical content JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = {
              "syllabus-index.json": dict,
              "content/practice_questions.json": list,
              "content/microtopic_explanations.json": dict,
              "content/quick_learn_cards.json": dict,
              "content/deep_dive_explanations.json": dict,
              "content/active_recall.json": dict,
          }

          loaded = {}
          for name, expected_type in files.items():
              path = Path(name)
              assert path.exists(), f"Missing canonical content file: {name}"
              with path.open(encoding="utf-8") as f:
                  value = json.load(f)
              assert isinstance(value, expected_type), (
                  f"{name}: expected {expected_type.__name__}, got {type(value).__name__}"
              )
              loaded[name] = value
              print(f"Validated {name}")

          syllabus = loaded["syllabus-index.json"]
          units = syllabus.get("units")
          assert isinstance(units, list) and units, "syllabus-index.json: missing units"

          micro_ids = {
              (str(u.get("id")), str(t.get("id")), str(m.get("id")))
              for u in units
              for t in u.get("topics", [])
              for m in t.get("microtopics", [])
          }
          assert micro_ids, "syllabus-index.json: no micro-topics found"

          questions = loaded["content/practice_questions.json"]
          ids = [q.get("id") for q in questions]
          assert all(ids), "PYQ: missing question id"
          assert len(ids) == len(set(ids)), "PYQ: duplicate question ids"

          bad_answers = [
              q["id"] for q in questions
              if not isinstance(q.get("answer"), int)
              or not 0 <= q["answer"] < len(q.get("options", []))
          ]
          assert not bad_answers, f"PYQ: invalid answer indexes: {bad_answers[:10]}"

          bad_mapping = []
          confidence_counts = {"high": 0, "medium": 0, "low": 0, "unmapped": 0, "missing": 0}
          for q in questions:
              key = (str(q.get("unit")), str(q.get("topic")), str(q.get("micro")))
              conf = q.get("mapping_confidence")
              confidence_counts[conf if conf in confidence_counts else "missing"] += 1
              if any(v is not None for v in (q.get("unit"), q.get("topic"), q.get("micro"))) and key not in micro_ids:
                  bad_mapping.append(q["id"])
          assert not bad_mapping, f"PYQ: invalid non-null syllabus mappings: {bad_mapping[:10]}"

          missing_explanations = [
              q["id"] for q in questions
              if not str(q.get("explanation", "")).strip()
          ]
          assert not missing_explanations, (
              f"PYQ: missing explanations: {missing_explanations[:10]}"
          )

          print(f"Content units: {len(units)}")
          print(f"Micro-topics: {len(micro_ids)}")
          print(f"PYQs: {len(questions)}")
          print(f"Mapping confidence: {confidence_counts}")
          print(f"Canonical content files: {len(files)}")
          PY

      - name: Run content structure validator
        run: python scripts/validate_content.py
