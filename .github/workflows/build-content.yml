name: Validate Psychology content

on:
  push:
    branches: [main]
    paths:
      - data.json
      - scripts/build_practice.py
      - practice_explanations.json
      - .github/workflows/build-content.yml
  pull_request:
    branches: [main]
    paths:
      - data.json
      - scripts/build_practice.py
      - practice_explanations.json
      - .github/workflows/build-content.yml

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Validate content JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data.json").read_text(encoding="utf-8"))
          assert isinstance(data,dict) and isinstance(data.get("units"),list)
          print(f"Validated {len(data['units'])} units")
          PY

      - name: Build practice bank
        run: python scripts/build_practice.py

      - name: Validate generated browser bundle
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          raw=Path("data.json").read_text(encoding="utf-8")
          version=hashlib.sha256(raw.encode("utf-8")).hexdigest()[:16]
          expected="window.NETPSY_DATA = "+raw+";
"
          assert Path("data.js").read_text(encoding="utf-8")==expected, "data.js is stale; rebuild it before publishing"
          expected_version="window.NETPSY_DATA_VERSION = "+json.dumps(version)+";
"
          assert Path("content-version.js").read_text(encoding="utf-8")==expected_version, "content-version.js is stale; rebuild it before publishing"
          print("Generated browser bundles are current:",version)
          PY

      - name: Validate generated files are tracked
        run: git diff --exit-code -- data.js content-version.js practice_questions.json practice-build-report.json
