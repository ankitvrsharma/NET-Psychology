name: Validate Psychology content

on:
  push:
    branches: [main]
    paths:
      - data/syllabus-index.json
      - content-pools/**
      - content/**
      - scripts/validate_content_pools.py
      - .github/workflows/build-content.yml
  pull_request:
    branches: [main]
    paths:
      - data/syllabus-index.json
      - content-pools/**
      - content/**
      - scripts/validate_content_pools.py
      - .github/workflows/build-content.yml

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every content pool independently
        run: python scripts/validate_content_pools.py

      - name: Check JavaScript syntax
        run: node --check app.js && node --check sw.js
