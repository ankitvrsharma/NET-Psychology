name: Source to content automation

on:
  push:
    branches: [main]
    paths:
      - "sources/inbox/**"
      - "sources/source-policy.json"
      - "scripts/source_to_content.py"
      - "scripts/ai_content_audit.py"
      - "data/ai-content-audit-policy.json"
      - ".github/workflows/source-to-content.yml"
      - "data/content-generation-request.json"
  workflow_dispatch:
    inputs:
      repair_existing:
        description: "Repair stale Quick Learn references and unresolved question mappings"
        required: false
        default: "true"
      synthesize_sources:
        description: "Generate source-grounded learning content from sources/inbox"
        required: false
        default: "true"
      enrich_existing:
        description: "Generate source-grounded content for an Admin task"
        required: false
        default: "true"
      admin_instruction:
        description: "Job-specific instruction from the Admin panel"
        required: false
        default: ""
      target_microtopics:
        description: "Comma-separated canonical micro-topic IDs for this generation run"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-to-content
  cancel-in-progress: false

jobs:
  build-content-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install --upgrade pip
          pip install pypdf python-docx python-pptx
      - name: Compile content automation script
        run: python -m py_compile scripts/source_to_content.py

      - name: Generate staged content
        id: generate_content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NET_CONTENT_MODEL: ${{ vars.NET_CONTENT_MODEL || '' }}
          NET_CONTENT_FALLBACKS: ${{ vars.NET_CONTENT_FALLBACKS || '' }}
          NET_MAX_TOPICS_PER_RUN: "54"
          NET_SKIP_GEMINI_INSIGHTS: "true"
          NET_ADMIN_INSTRUCTION: ${{ github.event.inputs.admin_instruction || '' }}
          NET_ADMIN_TARGETS: ${{ github.event.inputs.target_microtopics || '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q "^data/content-generation-request.json$"; then
            python -c 'import json, os; r=json.load(open("data/content-generation-request.json",encoding="utf-8")); e=open(os.environ["GITHUB_ENV"],"a",encoding="utf-8"); e.write("NET_ADMIN_INSTRUCTION<<NET_ADMIN_INSTRUCTION_EOF\n"+str(r.get("instruction","")).rstrip()+"\nNET_ADMIN_INSTRUCTION_EOF\n"); e.write("NET_ADMIN_TARGETS="+",".join(str(x).strip() for x in r.get("target_microtopics",[]) if str(x).strip())+"\n"); e.close()'
          fi
          echo "generated=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q "^data/content-generation-request.json$"; then
            REPAIR="$(python -c 'import json; print("true" if json.load(open("data/content-generation-request.json",encoding="utf-8")).get("repair_existing") else "false")')
          echo "generated=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q "^data/content-generation-request.json$"; then
            REPAIR="$(python - <<'PY'
            import json
            print("true" if json.loads(open("data/content-generation-request.json",encoding="utf-8")).get("repair_existing") else "false")
            PY
            )"
            ENRICH="true"
            SYNTH="false"
          else
            REPAIR="${{ github.event.inputs.repair_existing || 'false' }}"
            ENRICH="${{ github.event.inputs.enrich_existing || 'true' }}"
            SYNTH="${{ github.event.inputs.synthesize_sources || 'true' }}"
          fi
          SOURCE_TRIGGERED="false"
          REWRITE_EXISTING="false"
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            if echo "$CHANGED" | grep -q "^sources/inbox/"; then SOURCE_TRIGGERED="true"; fi
            if echo "$CHANGED" | grep -q "^data/content-generation-request.json$"; then REWRITE_EXISTING="true"; fi
          else
            if [ "$SYNTH" = "true" ]; then SOURCE_TRIGGERED="true"; fi
            if [ "$ENRICH" = "true" ]; then REWRITE_EXISTING="true"; fi
          fi
          if [ "$SOURCE_TRIGGERED" != "true" ] && [ "$REWRITE_EXISTING" != "true" ]; then
            echo "No content-generation trigger detected; nothing to generate."
            exit 0
          fi
          ARGS=""
          if [ "$REPAIR" = "true" ]; then ARGS="$ARGS --repair-existing"; fi
          if [ "$SOURCE_TRIGGERED" = "true" ]; then ARGS="$ARGS --source-triggered"; fi
          if [ "$REWRITE_EXISTING" = "true" ]; then ARGS="$ARGS --rewrite-existing"; fi
          python scripts/source_to_content.py $ARGS
          if [ -f content-staging/canonical-content.json ]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Generation completed without staged canonical content."
            exit 1
          fi

      - name: AI audit and two-retry rewrite gate
        if: ${{ steps.generate_content.outputs.generated == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NET_CONTENT_MODEL: ${{ vars.NET_CONTENT_MODEL || '' }}
          NET_CONTENT_FALLBACKS: ${{ vars.NET_CONTENT_FALLBACKS || '' }}
          NET_SKIP_GEMINI_INSIGHTS: "true"
        run: python scripts/ai_content_audit.py

      - name: Publish audited content directly to main
        if: ${{ success() && steps.generate_content.outputs.generated == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NET_CONTENT_MODEL: ${{ vars.NET_CONTENT_MODEL || '' }}
          NET_CONTENT_FALLBACKS: ${{ vars.NET_CONTENT_FALLBACKS || '' }}
        run: |
          REPAIR="${{ github.event.inputs.repair_existing || 'true' }}"
          ARGS="--apply-staged"
          if [ "$REPAIR" = "true" ]; then ARGS="$ARGS --repair-existing"; fi
          python scripts/source_to_content.py $ARGS

      - name: Validate published pools
        run: python scripts/validate_content.py

      - name: Publish approved content
        if: ${{ success() && steps.generate_content.outputs.generated == 'true' }}
        env:
          NET_CONTENT_PUBLISH_TOKEN: ${{ secrets.NET_CONTENT_PUBLISH_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No audited content changes generated. Any final audit failures remain in data/content-approval-queue.json."
            exit 0
          fi
          if [ -z "$NET_CONTENT_PUBLISH_TOKEN" ]; then
            echo "NET_CONTENT_PUBLISH_TOKEN is required for direct publication. A GITHUB_TOKEN push does not trigger a GitHub Pages build."
            exit 1
          fi
          git config user.name "net-psychology-content-bot"
          git config user.email "actions@github.com"
          git add content data content-provenance.json
          git commit -m "chore: publish AI-audited Psychology content"
          git remote set-url origin "https://x-access-token:$NET_CONTENT_PUBLISH_TOKEN@github.com/${GITHUB_REPOSITORY}.git"
          git push origin main
