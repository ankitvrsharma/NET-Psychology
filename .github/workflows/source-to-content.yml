name: ChatGPT-assisted content pipeline

on:
  push:
    branches: ["**"]
    paths:
      - "sources/inbox/**"
      - "data/content-generation-request.json"
      - "content-staging/chatgpt-response.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chatgpt-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-packet:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect source or admin request changes
        id: detect
        shell: bash
        run: |
          CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(data/content-generation-request\.json|sources/inbox/)'; then
            echo "prepare=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepare=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -q '^data/content-generation-request\.json$'; then
            echo "request=true" >> "$GITHUB_OUTPUT"
          else
            echo "request=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -q '^sources/inbox/'; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.detect.outputs.prepare == 'true' }}
        with:
          python-version: "3.12"
      - name: Install source extraction dependencies
        if: ${{ steps.detect.outputs.prepare == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          pip install pypdf python-docx python-pptx
      - name: Restore persistent source extraction cache
        if: ${{ steps.detect.outputs.prepare == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/source-extraction
          key: source-extraction-v4-${{ runner.os }}-${{ hashFiles('sources/inbox/**') }}-${{ hashFiles('.cache/source-extraction/*.json') }}
          restore-keys: |
            source-extraction-v4-${{ runner.os }}-${{ hashFiles('sources/inbox/**') }}-
            source-extraction-v4-${{ runner.os }}-
      - name: Extract and cache approved sources
        if: ${{ steps.detect.outputs.prepare == 'true' }}
        run: python scripts/source_to_content.py --prepare-source-cache
      - name: Save persistent source extraction cache
        if: ${{ steps.detect.outputs.prepare == 'true' && hashFiles('.cache/source-extraction/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/source-extraction
          key: source-extraction-v4-${{ runner.os }}-${{ hashFiles('sources/inbox/**') }}-${{ hashFiles('.cache/source-extraction/*.json') }}
      - name: Prepare source-grounded ChatGPT packet
        if: ${{ steps.detect.outputs.prepare == 'true' }}
        run: |
          if [ "${{ steps.detect.outputs.source }}" = "true" ] && [ "${{ steps.detect.outputs.request }}" != "true" ]; then
            python scripts/prepare_chatgpt_packet.py --source-triggered
          else
            python scripts/prepare_chatgpt_packet.py
          fi
      - name: Upload ChatGPT packet
        if: ${{ steps.detect.outputs.prepare == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: net-psychology-chatgpt-content-packet
          path: |
            content-staging/chatgpt-packet.json
            content-staging/chatgpt-packet.md
          if-no-files-found: error
          retention-days: 14

  import-chatgpt-response:
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect ChatGPT response
        id: detect
        shell: bash
        run: |
          CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          if echo "$CHANGED" | grep -q '^content-staging/chatgpt-response\.json$'; then
            echo "response=true" >> "$GITHUB_OUTPUT"
          else
            echo "response=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.detect.outputs.response == 'true' }}
        with:
          python-version: "3.12"
      - name: Install source extraction dependencies
        if: ${{ steps.detect.outputs.response == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          pip install pypdf python-docx python-pptx
      - name: Restore persistent source extraction cache
        if: ${{ steps.detect.outputs.response == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/source-extraction
          key: source-extraction-v4-${{ runner.os }}-${{ hashFiles('sources/inbox/**') }}-${{ hashFiles('.cache/source-extraction/*.json') }}
          restore-keys: |
            source-extraction-v4-${{ runner.os }}-${{ hashFiles('sources/inbox/**') }}-
            source-extraction-v4-${{ runner.os }}-
      - name: Prepare any missing source cache entries
        if: ${{ steps.detect.outputs.response == 'true' }}
        run: python scripts/source_to_content.py --prepare-source-cache
      - name: Validate ChatGPT JSON and protect verified components
        if: ${{ steps.detect.outputs.response == 'true' }}
        run: python scripts/import_chatgpt_response.py
      - name: Apply validated package to a working tree
        if: ${{ steps.detect.outputs.response == 'true' }}
        run: python scripts/source_to_content.py --apply-staged
      - name: Validate published content pools
        if: ${{ steps.detect.outputs.response == 'true' }}
        run: |
          python scripts/validate_content.py
          python -m py_compile scripts/source_to_content.py scripts/prepare_chatgpt_packet.py scripts/import_chatgpt_response.py
      - name: Open content review PR
        if: ${{ success() && steps.detect.outputs.response == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f content-staging/chatgpt-response.json content-staging/canonical-content-approved.json content-staging/chatgpt-import-report.json
          git config user.name "net-psychology-content-bot"
          git config user.email "actions@github.com"
          git add content data/verification-state.json content-provenance.json content-staging
          if git diff --cached --quiet; then
            echo "No content changes to propose."
            exit 0
          fi
          git commit -m "content: import ChatGPT-reviewed Psychology learning package"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh pr create --base main --head "${GITHUB_REF_NAME}" --title "Content: review ChatGPT-generated Psychology package" --body "## Source-grounded content review\n\nThis PR imports a ChatGPT-assisted package prepared from the project's approved source library and standing content instructions. The importer validated the package schema, canonical IDs, cross-references, and exact preservation of EXPERT VERIFIED components. The existing content validator passed.\n\nPlease review factual accuracy and source support before merging. This workflow uses no model API key and does not publish content directly to main."
