name: Source to content automation

on:
  push:
    branches: [main]
    paths:
      - "sources/inbox/**"
      - "sources/source-policy.json"
      - "data/content-enrichment-instructions.json"
      - "scripts/source_to_content.py"
      - "scripts/ai_content_audit.py"
      - "data/ai-content-audit-policy.json"
      - ".github/workflows/source-to-content.yml"
  workflow_dispatch:
    inputs:
      repair_existing:
        description: "Repair stale Quick Learn references and unresolved question mappings"
        required: false
        default: "true"
      synthesize_sources:
        description: "Generate source-grounded learning content from sources/inbox"
        required: false
        default: "true"
      enrich_existing:
        description: "Apply the saved admin enrichment instruction to source-backed learning packages"
        required: false
        default: "true"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-to-content
  cancel-in-progress: false

jobs:
  build-content-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install --upgrade pip
          pip install pypdf python-docx python-pptx
      - name: Compile content automation script
        run: python -m py_compile scripts/source_to_content.py

      - name: Generate staged content
        if: ${{ github.event.inputs.synthesize_sources != 'false' || github.event.inputs.repair_existing != 'false' || github.event.inputs.enrich_existing != 'false' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NET_CONTENT_MODEL: ${{ vars.NET_CONTENT_MODEL || '' }}
          NET_CONTENT_FALLBACKS: ${{ vars.NET_CONTENT_FALLBACKS || '' }}
          NET_MAX_TOPICS_PER_RUN: "3"
          NET_SKIP_GEMINI_INSIGHTS: "true"
        run: |
          REPAIR="${{ github.event.inputs.repair_existing || 'false' }}"
          ENRICH="${{ github.event.inputs.enrich_existing || 'true' }}"
          SYNTH="${{ github.event.inputs.synthesize_sources || 'true' }}"
          SOURCE_TRIGGERED="false"
          REWRITE_EXISTING="false"
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            if echo "$CHANGED" | grep -q "^sources/inbox/"; then SOURCE_TRIGGERED="true"; fi
            if echo "$CHANGED" | grep -q "^data/content-enrichment-instructions.json$"; then REWRITE_EXISTING="true"; fi
          else
            if [ "$SYNTH" = "true" ]; then SOURCE_TRIGGERED="true"; fi
            if [ "$ENRICH" = "true" ]; then REWRITE_EXISTING="true"; fi
          fi
          if [ "$SOURCE_TRIGGERED" != "true" ] && [ "$REWRITE_EXISTING" != "true" ]; then
            echo "No content-generation trigger detected; nothing to generate."
            exit 0
          fi
          ARGS=""
          if [ "$REPAIR" = "true" ]; then ARGS="$ARGS --repair-existing"; fi
          if [ "$SOURCE_TRIGGERED" = "true" ]; then ARGS="$ARGS --source-triggered"; fi
          if [ "$REWRITE_EXISTING" = "true" ]; then ARGS="$ARGS --rewrite-existing"; fi
          python scripts/source_to_content.py $ARGS

      - name: AI audit and two-retry rewrite gate
        if: ${{ github.event.inputs.synthesize_sources != 'false' || github.event.inputs.enrich_existing != 'false' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NET_CONTENT_MODEL: ${{ vars.NET_CONTENT_MODEL || '' }}
          NET_CONTENT_FALLBACKS: ${{ vars.NET_CONTENT_FALLBACKS || '' }}
          NET_SKIP_GEMINI_INSIGHTS: "true"
        run: python scripts/ai_content_audit.py

      - name: Publish audited content directly to main
        if: ${{ success() }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NET_CONTENT_MODEL: ${{ vars.NET_CONTENT_MODEL || '' }}
          NET_CONTENT_FALLBACKS: ${{ vars.NET_CONTENT_FALLBACKS || '' }}
        run: |
          REPAIR="${{ github.event.inputs.repair_existing || 'true' }}"
          ARGS="--apply-staged"
          if [ "$REPAIR" = "true" ]; then ARGS="$ARGS --repair-existing"; fi
          python scripts/source_to_content.py $ARGS

      - name: Validate published pools
        run: python scripts/validate_content.py

      - name: Publish approved content
        if: ${{ success() }}
        env:
          NET_CONTENT_PUBLISH_TOKEN: ${{ secrets.NET_CONTENT_PUBLISH_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No audited content changes generated. Any final audit failures remain in data/content-approval-queue.json."
            exit 0
          fi
          if [ -z "$NET_CONTENT_PUBLISH_TOKEN" ]; then
            echo "NET_CONTENT_PUBLISH_TOKEN is required for direct publication. A GITHUB_TOKEN push does not trigger a GitHub Pages build."
            exit 1
          fi
          git config user.name "net-psychology-content-bot"
          git config user.email "actions@github.com"
          git add content data content-provenance.json
          git commit -m "chore: publish AI-audited Psychology content"
          git remote set-url origin "https://x-access-token:$NET_CONTENT_PUBLISH_TOKEN@github.com/${GITHUB_REPOSITORY}.git"
          git push origin main
