name: Source to content automation

on:
  push:
    branches: [main]
    paths:
      - "sources/inbox/**"
      - "sources/source-policy.json"
      - "scripts/source_to_content.py"
      - ".github/workflows/source-to-content.yml"
  workflow_dispatch:
    inputs:
      repair_existing:
        description: "Repair stale Quick Learn references and unresolved question mappings"
        required: false
        default: "true"
      synthesize_sources:
        description: "Generate source-grounded learning content from sources/inbox"
        required: false
        default: "true"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-to-content
  cancel-in-progress: false

jobs:
  build-content-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install --upgrade pip
          pip install openai pypdf python-docx python-pptx
      - name: Generate and repair content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NET_CONTENT_MODEL: ${{ vars.NET_CONTENT_MODEL || 'gpt-5-mini' }}
          NET_MAX_TOPICS_PER_RUN: "20"
        run: |
          REPAIR="${{ github.event.inputs.repair_existing || 'true' }}"
          SYNTH="${{ github.event.inputs.synthesize_sources || 'true' }}"
          if [ "$SYNTH" = "true" ] && [ "$REPAIR" = "true" ]; then
            python scripts/source_to_content.py --apply --repair-existing
          elif [ "$SYNTH" = "true" ]; then
            python scripts/source_to_content.py --apply
          elif [ "$REPAIR" = "true" ]; then
            python scripts/source_to_content.py --apply --repair-existing --no-source-synthesis
          else
            echo "Nothing requested."
          fi
      - name: Validate published pools
        run: python scripts/validate_content.py
      - name: Create review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No content changes generated."
            exit 0
          fi
          BRANCH="automation/source-content-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git config user.name "net-psychology-content-bot"
          git config user.email "actions@github.com"
          git add content data content-provenance.json
          git commit -m "chore: synthesize and repair Psychology content"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH"             --title "Automated Psychology source/content update"             --body "Generated by the source-to-content pipeline. Source material is converted into reviewable static learner content; stale Quick Learn references and unresolved question mappings are repaired only when confidence is high. Review the diff before merging."
