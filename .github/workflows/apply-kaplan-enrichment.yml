name: Apply Kaplan enrichment UI

on:
  push:
    paths:
      - 'kaplan_enrichment.json'
      - '.github/workflows/apply-kaplan-enrichment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update app, service worker and content version
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.js").read_text()
          old_load = """  if(!json || !Array.isArray(json.units)) throw new Error('Study data has an invalid structure');
            D=json;"""
          new_load = """  if(!json || !Array.isArray(json.units)) throw new Error('Study data has an invalid structure');
            try{
              const kr=await fetch('./kaplan_enrichment.json?v='+DATA_VERSION+'',{cache:'default'});
              if(kr.ok){
                const kp=await kr.json();
                const map=kp&&kp.microtopics&&typeof kp.microtopics==='object'?kp.microtopics:{};
                for(const u of json.units||[]) for(const t of u.topics||[]) for(const m of t.microtopics||[]){
                  if(map[m.title]) m.kaplan_enrichment={source:kp.source?.title||'Kaplan AP Psychology Prep Plus',role:kp.source?.role||'Primary enrichment source',notes:map[m.title]};
                }
                json.kaplan_enrichment_meta=kp.source||null;
              }
            }catch(e){console.warn('Kaplan enrichment could not be loaded:',e)}
            D=json;"""
          if old_load not in app:
              raise SystemExit("load target not found")
          app = app.replace(old_load, new_load, 1)

          old_notes = """const studyNotesHTML=(m,concept,kp,core,trap,hook)=>{const pyq=section(m.content_notes,'PYQ-STYLE PATTERN','\\n\\nCOMMON TRAP')||section(m.content_notes,'PYQ-STYLE PATTERN','\\n\\n5-MINUTE TEACHING FOCUS');const focus=section(m.content_notes,'5-MINUTE TEACHING FOCUS','\\n\\nMEMORY HOOK');const example=m.application_question||'';return '<div class="study-notes"><div class="study-note-intro"><span class="eyebrow">STUDY NOTES</span><h2>'+esc(m.title)+'</h2><p>Read for structure first. Then close the notes and retrieve the idea from memory.</p></div>'+noteSection('1. Core idea',concept,'core')+(kp.length?'<section class="study-note-block"><h3>2. Key points</h3><ul class="study-note-list">'+kp.slice(0,7).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></section>':'')+noteSection('3. Explanation & connections',core,'explanation')+noteSection('4. Apply it',example,'application')+noteSection('5. Exam focus',pyq,'exam-focus')+noteSection('6. Common trap / distinction',trap,'trap')+noteSection('7. 5-minute teaching focus',focus,'teaching-focus')+noteSection('8. Memory cue',hook,'memory')+(!pyq&&!focus&&!trap&&!hook?'<p class="study-note-source-note">Use the key points above as the primary revision notes; the recall stage is deliberately kept separate so you test yourself rather than reread.</p>':'')+'</div>';};"""
          new_notes = """const studyNotesHTML=(m,concept,kp,core,trap,hook)=>{const pyq=section(m.content_notes,'PYQ-STYLE PATTERN','\\n\\nCOMMON TRAP')||section(m.content_notes,'PYQ-STYLE PATTERN','\\n\\n5-MINUTE TEACHING FOCUS');const focus=section(m.content_notes,'5-MINUTE TEACHING FOCUS','\\n\\nMEMORY HOOK');const example=m.application_question||'';const kaplan=m.kaplan_enrichment?.notes||'';return '<div class="study-notes"><div class="study-note-intro"><span class="eyebrow">STUDY NOTES</span><h2>'+esc(m.title)+'</h2><p>Read for structure first. Then close the notes and retrieve the idea from memory.</p></div>'+noteSection('1. Core idea',concept,'core')+(kp.length?'<section class="study-note-block"><h3>2. Key points</h3><ul class="study-note-list">'+kp.slice(0,7).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></section>':'')+noteSection('3. Kaplan enrichment',kaplan,'kaplan-enrichment')+noteSection('4. Explanation & connections',core,'explanation')+noteSection('5. Apply it',example,'application')+noteSection('6. Exam focus',pyq,'exam-focus')+noteSection('7. Common trap / distinction',trap,'trap')+noteSection('8. 5-minute teaching focus',focus,'teaching-focus')+noteSection('9. Memory cue',hook,'memory')+(!pyq&&!focus&&!trap&&!hook&&!kaplan?'<p class="study-note-source-note">Use the key points above as the primary revision notes; the recall stage is deliberately kept separate so you test yourself rather than reread.</p>':'')+'</div>';};"""
          if old_notes not in app:
              raise SystemExit("notes target not found")
          app = app.replace(old_notes, new_notes, 1)
          Path("app.js").write_text(app)

          sw = Path("sw.js").read_text()
          if "'./kaplan_enrichment.json'," not in sw:
              sw = sw.replace("  './content-version.js',", "  './content-version.js',\n  './kaplan_enrichment.json',", 1)
          sw = sw.replace("const CACHE='netpsych-shell-v2';", "const CACHE='netpsych-shell-v3';", 1)
          Path("sw.js").write_text(sw)

          Path("content-version.js").write_text('window.NETPSY_DATA_VERSION = "2026-10-02-kaplan-primary-enrichment-v1";\n')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js content-version.js
          git diff --cached --quiet || git commit -m "feat: integrate Kaplan enrichment into learning flow"
          git push
