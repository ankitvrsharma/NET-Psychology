name: NTA Psychology PYQ Sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4 pypdf
      - name: Discover official NTA Psychology assets
        run: python scripts/nta_pyq_sync.py
      - name: Open a review PR for discovered changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/nta-psychology-pyq-sync
          delete-branch: true
          add-paths: data/nta_pyq_registry.json
          commit-message: "chore: sync official NTA Psychology PYQ assets"
          title: "NTA Psychology PYQ sync"
          body: |
            Automated discovery of official NTA Psychology answer-key/question-paper assets.

            Review the discovered sources and registry changes before merging into the live PYQ bank.
