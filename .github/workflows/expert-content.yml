name: Expert content audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate content pools
        run: python scripts/validate_content_pools.py
      - name: Run deterministic expert audit
        run: python scripts/expert_audit.py
