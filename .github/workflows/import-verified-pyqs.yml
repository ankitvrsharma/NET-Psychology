name: Import authoritative verified PYQs into website pool

on:
  pull_request:
    branches: [main]
    paths:
      - telegram-quiz/data/question_bank.xlsx
      - scripts/import_verified_pyqs.py
      - data/syllabus-index.json
      - data/mcq_mapping.json
      - content/questions/questions.json

permissions:
  contents: write
  pull-requests: read

jobs:
  import-verified-pyqs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install openpyxl==3.1.5
      - name: Import workbook and merge existing website pool
        run: python scripts/import_verified_pyqs.py
      - name: Validate generated question pool
        run: python scripts/validate_content.py
      - name: Commit generated website content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/questions/questions.json data/pyq-import-audit.json
          if git diff --cached --quiet; then
            echo "Generated question pool is already up to date."
          else
            git commit -m "Import verified PYQs into website question pool"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
