name: Snapshot canonical content pools
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and snapshot canonical JSON pools
        run: python scripts/snapshot_content_pools.py
      - uses: actions/upload-artifact@v4
        with:
          name: net-psychology-content-pools-${{ github.sha }}
          path: content-pools-snapshot.zip
          retention-days: 90
