name: Rewrite and Re-audit Content

on:
  workflow_dispatch:
  push:
    paths:
      - config/content-owner-overrides.json

permissions:
  contents: write

concurrency:
  group: content-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rewrite rejected content and re-audit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REWRITE_MODEL: ${{ vars.OPENAI_REWRITE_MODEL }}
        run: |
          python scripts/rewrite_content.py

      - name: Commit rewritten content
        run: |
          if git diff --quiet; then
            echo "No rewrite changes were produced."
            exit 0
          fi
          git config user.name "net-psychology-rewrite[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/microtopics/microtopic_explanations.json content/questions/questions.json config/content-owner-overrides.json operations/rewrite-reaudit-tracking.json
          git commit -m "Rewrite and re-audit blocked content"
          git push
