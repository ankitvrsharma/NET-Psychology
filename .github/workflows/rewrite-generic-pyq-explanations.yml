name: Rewrite Generic PYQ Explanations

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Questions per Gemini request"
        required: false
        default: "30"
      max_batches:
        description: "Optional staged-run limit; 0 = all remaining"
        required: false
        default: "0"
  push:
    paths:
      - scripts/rewrite_generic_pyq_explanations.py

permissions:
  contents: write

concurrency:
  group: generic-pyq-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.actor != 'github-actions[bot]'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_REWRITE_MODEL: ${{ vars.GEMINI_REWRITE_MODEL }}
      PYQ_BATCH_SIZE: ${{ inputs.batch_size || '30' }}
      PYQ_MAX_BATCHES: ${{ inputs.max_batches || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite generic PYQ explanations
        run: python scripts/rewrite_generic_pyq_explanations.py
      - name: Validate content structure
        run: python scripts/validate_content_pools.py
      - name: Verify generic-template audit
        run: |
          python - <<'PY'
          import json
          markers=(
              "The stem describes the concept or relationship represented by",
              "Evaluate each statement independently against the relevant psychological principle",
              "Arrange the items according to the established chronological, developmental, or logical order",
              "Check each List-I item against its specific person, concept, function, or description",
          )
          qs=json.load(open("content/questions/questions.json",encoding="utf-8"))
          bad=[q["id"] for q in qs if any(m in str(q.get("explanation","")) for m in markers)]
          print("Generic explanation templates remaining:",len(bad))
          if bad:
              raise SystemExit("Generic explanations remain: "+", ".join(map(str,bad[:20])))
          print("Second generic-template audit: PASS")
          PY
      - name: Rebuild content version
        run: |
          python - <<'PY'
          import hashlib,json
          raw=open("data.json","rb").read()
          version=hashlib.sha256(raw).hexdigest()[:16]
          open("content-version.js","w",encoding="utf-8").write("window.NETPSY_DATA_VERSION = "+json.dumps(version)+";\n")
          PY
      - name: Commit rewritten PYQ explanations
        run: |
          git config user.name "net-psychology-rewrite[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/questions/questions.json generic-pyq-rewrite-progress.json generic-pyq-rewrite-log.json
          git diff --cached --quiet && exit 0
          git commit -m "Rewrite generic PYQ explanations"
          git push
