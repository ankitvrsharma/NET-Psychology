name: Schedule Daily Psychology Quiz in Telegram

on:
  # Temporarily pause the daily trigger until the isolated poll test passes.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-daily-quiz
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-quiz/requirements.txt
      - name: Install dependencies
        run: pip install -r telegram-quiz/requirements.txt
      - name: Add quiz to Telegram scheduled queue
        working-directory: telegram-quiz
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_QUESTION_COUNT: "5"
          QUIZ_POST_HOUR_IST: "18"
          QUIZ_POST_MINUTE_IST: "0"
          QUIZ_TEST_MODE: "true"
        run: python diagnose_telegram_poll.py
      - name: Save no-repeat history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram-quiz/posted_ids.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram quiz scheduling history"
            git push
          fi
