name: Telegram Daily Psychology Quiz

on:
  schedule:
    # 08:00 Asia/Kolkata (UTC+05:30) = 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-daily-quiz
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-quiz/requirements.txt

      - name: Install dependencies
        run: pip install -r telegram-quiz/requirements.txt

      - name: Publish five quiz polls
        working-directory: telegram-quiz
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_QUESTION_COUNT: "5"
        run: python quiz_poster.py

      - name: Save no-repeat history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram-quiz/posted_ids.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram quiz posting history"
            git push
          fi
