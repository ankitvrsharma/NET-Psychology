name: Maintain Advance Daily Psychology Quiz Queue

on:
  # 17:35 IST (12:05 UTC): top up Telegram's native queue to seven days ahead.
  schedule:
    - cron: "5 12 * * *"
  workflow_dispatch:
  # Run the one-time legacy-poll migration immediately after scheduler code changes.
  push:
    paths:
      - "telegram-quiz/schedule_quiz.py"
      - ".github/workflows/telegram-daily-quiz.yml"

permissions:
  contents: write

concurrency:
  group: telegram-daily-quiz
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-quiz/requirements.txt
      - name: Install dependencies
        run: pip install -r telegram-quiz/requirements.txt
      - name: Top up Telegram's native scheduled queue
        working-directory: telegram-quiz
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_QUESTION_COUNT: "5"
          QUIZ_POST_HOUR_IST: "18"
          QUIZ_POST_MINUTE_IST: "0"
          TARGET_QUIZZES_AHEAD: "7"
          MAX_SCHEDULED_MESSAGES: "80"
          QUIZ_TEST_MODE: "false"
          REFRESH_LEGACY_QUIZ_QUEUE: "true"
        run: python schedule_quiz.py
      - name: Save no-repeat history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram-quiz/posted_ids.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram quiz scheduling history"
            git push
          fi
