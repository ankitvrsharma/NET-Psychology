name: Inspect content snapshot

on:
  push:
    branches: [main]
    paths:
      - data.json

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package content snapshot
        run: |
          cp data.json microtopic-data.json
          python - <<'PY'
          import json
          d=json.load(open("data.json",encoding="utf-8"))
          micro=[]
          for u in d.get("units",[]):
            for t in u.get("topics",[]):
              for m in t.get("microtopics",t.get("microTopics",[])):
                micro.append({"unit":u.get("title"),"topic":t.get("title"),"microtopic":m})
          json.dump(micro,open("microtopics-extracted.json","w",encoding="utf-8"),ensure_ascii=False)
          print("microtopics",len(micro))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: microtopic-content-snapshot
          path: |
            data.json
            microtopics-extracted.json
