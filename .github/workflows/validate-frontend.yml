name: Validate frontend shell

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "app/**"
      - "style.css"
      - "manifest.webmanifest"
      - "supabase/**"
      - "scripts/**"
      - "docs/architecture/content-architecture.md"
      - "content-pools/registry.json"
      - ".github/workflows/validate-frontend.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "app/**"
      - "style.css"
      - "manifest.webmanifest"
      - "supabase/**"
      - "scripts/**"
      - "docs/architecture/content-architecture.md"
      - "content-pools/registry.json"
      - ".github/workflows/validate-frontend.yml"

permissions:
  contents: read

jobs:
  validate-browser-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" -print0 |
            xargs -0 -n1 node --check
      - name: Check content automation Python syntax
        run: |
          python -m py_compile scripts/source_to_content.py scripts/ai_content_audit.py scripts/validate_content.py scripts/sync_documentation.py scripts/prepare_chatgpt_packet.py scripts/import_chatgpt_response.py scripts/test_chatgpt_pipeline.py
          python -m unittest scripts.test_chatgpt_pipeline -v
          python -m unittest scripts.test_source_extraction_cache -v
      - name: Check runtime loading and page route contracts
        run: node scripts/validate-runtime-contracts.js
      - name: Check architecture documentation
        run: python scripts/sync_documentation.py
