name: Build canonical content category files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data.json'
      - 'practice_questions.json'
      - 'practice_explanations.json'
      - 'scripts/build_content_category_files.py'
      - '.github/workflows/build-content-category-files.yml'

permissions:
  contents: write

concurrency:
  group: content-category-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build five category files
        run: python scripts/build_content_category_files.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = [
            "practice_questions.json",
            "microtopic_explanations.json",
            "quick_learn_cards.json",
            "deep_dive_explanations.json",
            "active_recall.json",
          ]
          for name in expected:
              p = Path("content") / name
              assert p.exists(), p
              with p.open(encoding="utf-8") as f:
                  json.load(f)
          print("All five canonical content files are valid JSON.")
          PY

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/*.json
          if git diff --cached --quiet; then
            echo "No generated content changes."
            exit 0
          fi
          git commit -m "Build canonical content category files"
          git push
